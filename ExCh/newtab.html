<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
</head>
<body>

  <!-- پس‌زمینه کاربر -->
  <div id="custom-bg-overlay" class="bg-overlay"></div>

  <!-- کنترل‌های بالا سمت چپ -->
  <div class="top-controls">
    <button id="theme-toggle-btn" class="ios-glass-btn" title="تغییر تم شب/روز">
      <span id="theme-icon">🌙</span>
    </button>
    
    <!-- دکمه تنظیمات پس‌زمینه -->
    <button id="bg-settings-btn" class="ios-glass-btn" title="شخصی‌سازی تصویر زمینه">🖼</button>
    <div id="bg-dropdown-menu" class="glass-dropdown">
      <label class="dropdown-item">
        📁 انتخاب تصویر از سیستم
        <input type="file" id="bg-file-input" accept="image/*" style="display: none;">
      </label>
      <button id="toggle-blur-btn" class="dropdown-item">✨ وضعیت بلر: <span id="blur-status-text">مات</span></button>
      <button id="reset-bg-btn" class="dropdown-item danger">↺ حذف تصویر و بازنشانی</button>
    </div>
  </div>

  <div class="dashboard-container">
    
    <!-- ستون سمت راست: ساعت و تقویم شیشه‌ای -->
    <div class="col col-left">
      <div class="ios-glass-card weather-clock-card">
        <div class="clock-box">
          <div class="digital-clock" id="clock">00:00</div>
          <div class="date-text" id="shamsi-date">چهارشنبه، ۸ مهر</div>
        </div>
        <div class="weather-box">
          <span class="temp">۲۲°</span>
          <span class="weather-desc">آفتابی و شفاف</span>
        </div>
      </div>

      <div class="ios-glass-card calendar-card">
        <div class="calendar-header">
          <span>مهر ۱۴۰۵</span>
        </div>
        <div class="calendar-grid">
          <span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>
          <span class="dim">۲۸</span><span class="dim">۲۹</span><span class="dim">۳۰</span><span>۱</span><span>۲</span><span>۳</span><span class="holiday">۴</span>
          <span>۵</span><span>۶</span><span>۷</span><span class="today">۸</span><span>۹</span><span>۱۰</span><span class="holiday">۱۱</span>
          <span>۱۲</span><span>۱۳</span><span>۱۴</span><span>۱۵</span><span>۱۶</span><span>۱۷</span><span class="holiday">۱۸</span>
        </div>
      </div>
    </div>

    <!-- ستون وسط: سرچ‌بار کپسولی و شورت‌کات‌ها -->
    <div class="col col-center">
      
      <!-- سرچ‌بار آیفونی شیشه‌ای با قابلیت سوئیچ گوگل و ذره‌بین -->
      <div class="search-capsule" id="search-capsule">
        <form id="search-form" class="search-inner" action="https://www.google.com/search" method="GET">
          
          <div class="search-actions-left" id="search-tools">
            <span class="tool-btn" id="voice-btn" title="جستجوی صوتی گوگل">🎙️</span>
            <span class="tool-btn" id="lens-btn" title="گوگل لنز (جستجو با تصویر)">📷</span>
          </div>

          <input type="text" id="search-input" name="q" placeholder="جستجو در گوگل..." autofocus autocomplete="off">

          <!-- نشانگر و سوییچر موتور جستجو -->
          <div class="engine-badge" id="engine-switcher" title="کلیک برای تغییر به ذره‌بین / گوگل">
            <span class="badge-arrow">↕</span>
            <div id="engine-logo-container">
              <!-- لوگوی گوگل به عنوان پیش‌فرض -->
              <svg id="google-logo" viewBox="0 0 24 24" width="22" height="22">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.27 21.36 7.35 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.35 0 3.27 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <!-- لوگوی ذره‌بین -->
              <span id="zarebin-logo" class="zarebin-text" style="display: none;">ذره‌بین</span>
            </div>
          </div>

        </form>
      </div>

      <!-- شبکه میانبرهای شیشه‌ای -->
      <div class="shortcuts-container" id="shortcuts-grid"></div>

    </div>

    <!-- ستون سمت چپ: تسک‌ها -->
    <div class="col col-right">
      <div class="ios-glass-card todo-card">
        <div class="todo-header">
          <h3>✅ تسک‌های من</h3>
        </div>
        <ul class="todo-list" id="todo-list"></ul>
        <div class="todo-input-box">
          <input type="text" id="new-todo" placeholder="نوشتن تسک جدید...">
        </div>
      </div>
    </div>

  </div>

  <!-- مودال افزودن شورتکات -->
  <div id="add-modal" class="modal-overlay">
    <div class="modal-content ios-glass-card">
      <h3>افزودن میانبر</h3>
      <input type="text" id="modal-site-title" placeholder="نام میانبر">
      <input type="text" id="modal-site-url" placeholder="آدرس سایت (مثلاً: https://site.com)">
      <div class="modal-buttons">
        <button id="modal-save-btn" class="modal-btn save">افزودن</button>
        <button id="modal-cancel-btn" class="modal-btn cancel">انصراف</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
